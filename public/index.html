<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>claudex-dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  try {
    const p = JSON.parse(localStorage.getItem("claudex-dash:prefs") || "{}");
    if (p.theme === "scifi") document.documentElement.setAttribute("data-theme", "scifi");
  } catch (_) {}
</script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- Shipped `open` so it is already painting when the parser gets here: /app.js is a module and
     therefore deferred, so a gate raised from script could only cover the empty panels AFTER they
     had had a frame to show.

     Deliberately NOT modal. A markup-open dialog is non-modal — no top layer, no ::backdrop, no
     inertness, and a UA `position: absolute` that would scroll away with the page. Each of those is
     either wanted or answered here: `inert` below supplies the inertness, styles.css pins it fixed
     and paints it opaque, and non-modal means Esc does nothing to it, which is the requirement.
     Making it modal instead would mean close()+showModal() (showModal() on an already-open dialog
     throws) plus a cancel handler that browsers are allowed to overrule anyway. -->
<dialog id="gate" open aria-labelledby="gate-title">
  <h2 id="gate-title">claudex-dash</h2>
  <div class="body"><p class="note">reading claudex…</p></div>
</dialog>
<!-- inert until the first successful load: not focusable, not clickable, hidden from assistive
     tech. app.js lifts it in one place, next to gate.close(). -->
<header id="hdr" inert>
  <h1>claudex-dash</h1>
  <!-- Outside every <section>, so render()'s innerHTML never destroys it and the listeners can be
       bound once. Options are built from SORTS in app.js so the menu cannot drift from the
       comparators behind it. -->
  <div class="ctl" id="ctl">
    <label><input type="checkbox" id="only5x" /> 5x only</label>
    <select id="sort" aria-label="Sort accounts"></select>
  </div>
  <!-- All three of the next buttons must stay before #refresh: #refresh owns this row's
       margin-left:auto (styles.css) and a second auto margin would split the slack between them.
       All three are hidden until app.js has something for them to do. -->
  <button id="mine" hidden>Switch to mine</button>
  <!-- Pool start/stop toggle: carries no data-name (pool start/pool stop take no argument) — just
       data-kind ("start"/"stop"), set by updateConsuming() in app.js from consuming.js. Ships with
       no text: always populated before it's ever un-hidden. -->
  <button id="consuming" hidden></button>
  <!-- Autoswitch toggle: carries no data-name (autoswitch on/off take no argument) — just
       data-kind ("on"/"off"), set by updateAutoswitch() in app.js from autoswitch.js. Ships with
       no text: always populated before it's ever un-hidden. -->
  <button id="autoswitch" hidden></button>
  <button id="refresh">↻ Refresh</button>
  <span class="age" id="age"></span>
  <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>
<!-- Fixed to the bottom of the viewport (styles.css). Own inert, same reason as #hdr: not
     focusable/clickable until app.js lifts it next to gate.close(). -->
<nav class="tabs" id="tabbar" role="tablist" aria-label="claudex-dash panels" inert>
  <button role="tab" id="tab-usage"    aria-controls="usage"    aria-selected="false">Usage<span class="count"></span></button>
  <button role="tab" id="tab-pool"     aria-controls="pool"     aria-selected="true"
          title="Pool members">Pool<span class="count"></span></button>
  <button role="tab" id="tab-accounts" aria-controls="accounts" aria-selected="false">Accounts<span class="count"></span></button>
  <button role="tab" id="tab-access"   aria-controls="access"   aria-selected="false"
          aria-label="Who may borrow your account" title="Who may borrow your account">Access<span class="count"></span></button>
  <button role="tab" id="tab-status"   aria-controls="status"   aria-selected="false"
          aria-label="Pool status &amp; health" title="Pool status &amp; health">Health</button>
</nav>
<main id="app" inert>
  <section id="usage"    role="tabpanel" aria-labelledby="tab-usage" hidden><div class="body"></div></section>
  <section id="pool"     role="tabpanel" aria-labelledby="tab-pool"><div class="body"></div></section>
  <section id="accounts" role="tabpanel" aria-labelledby="tab-accounts" hidden><div class="body"></div></section>
  <section id="access"   role="tabpanel" aria-labelledby="tab-access" hidden><div class="body"></div></section>
  <section id="status"   role="tabpanel" aria-labelledby="tab-status" hidden><div class="body"></div></section>
</main>
<!-- Native <dialog>: Esc, focus trap, backdrop and background inertness come free, and the close
     button needs no JS at all because a <form method="dialog"> submit closes its own dialog. -->
<dialog id="detail" aria-labelledby="detail-name">
  <header class="dlg-h">
    <span class="name" id="detail-name"></span>
    <span class="plan"></span>
    <form method="dialog"><button class="close" aria-label="Close">&#10005;</button></form>
  </header>
  <div class="body"></div>
  <!-- Refresh is first in DOM order so it is the first stop on Tab into the footer. It refetches
       THIS member only: the Pool cards behind the dialog come from `pool members`, one command for
       everyone, so there is no per-person capture that could refresh them alongside this. -->
  <footer class="dlg-f">
    <button id="detail-refresh">↻ Refresh</button>
    <button id="detail-raw" aria-pressed="false">show raw</button>
  </footer>
</dialog>
<!-- Every write asks first. Outside <main> on purpose: inside, these buttons would bubble into the
     write handler bound there. That handler matches on closest("button[data-kind]") and these two
     carry no data-kind, so they miss it today — but a Cancel button that ever grew one would fire a
     switch, so keeping them out here is the actual defence rather than the selector.

     Enter confirms with no key handler, from four native behaviours in sequence:
       1. showModal() focuses the first `autofocus` descendant. Without it engines focus the dialog
          element itself and Enter does nothing — so autofocus is load-bearing, and unlike page-load
          autofocus it is re-read on every showModal().
       2. Enter on a focused button activates THAT button. This is focused-button activation, not
          implicit form submission (which would pick Cancel, the first submit button) — implicit
          submission only applies from a text field, and there is none here. So DOM order stays
          Cancel-then-Confirm, matching visual and tab order.
       3. method="dialog" closes the dialog and sets returnValue to the SUBMITTER's value.
       4. Esc closes too, leaving returnValue alone — see the reset in app.js's ask(). -->
<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <h2 id="confirm-title"></h2>
  <p id="confirm-body"></p>
  <form method="dialog">
    <button value="">Cancel</button>
    <button value="go" id="confirm-go" class="bad" autofocus></button>
  </form>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <header class="dlg-h">
    <span class="name" id="settings-title">Settings</span>
    <form method="dialog"><button class="close" aria-label="Close">&#10005;</button></form>
  </header>
  <div class="body">
    <div class="setting-row">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="default">Default</option>
        <option value="scifi">Sci-Fi</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="update-btn">Updates</label>
      <button id="update-btn">Check for updates</button>
    </div>
    <p class="note" id="update-status"></p>
  </div>
</dialog>
<!-- popover, not a plain div: a popover enters the top layer, so a toast raised while the pool
     detail <dialog> is open still renders above its backdrop. aria-live keeps the announcement the
     old .msg elements got from role="status". -->
<div id="toasts" popover="manual" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
